# https://github.com/intent-driven-dev/openspec-schemas
# schema: intent-driven
schema: spec-driven-with-adr

#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

rules:
  proposal:
    - Must use glossary skill
    - Must use grill-me skill
    - Must use adversarial-authoring skill
  specs:
    - Must use spec-as-source skill
  design:
    - Must use c4-diagrams skill
    - Must use glossary skill
    - Must use tdd skill
  adr:
    - Must use architectural-decision-records skill
    - Must check current codebase for established style/techniques/decisions
  tasks:
    - Must use spec-as-source skill
    - Must use tdd skill
    - Must make each task as small and simple as possible. Unix-like, one task to do one job well.
