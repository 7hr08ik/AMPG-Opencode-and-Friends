name: Bug report
description: Report something that's broken or not working.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Fill in as much as you can.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: What are you running? (OS, GPU, model server)
      placeholder: "e.g. Arch Linux, AMD, Lemonade Server on 127.0.0.1:13305"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
      placeholder: Describe the bug and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so I can reproduce it.
      value: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: Config you're using
      description: Any relevant changes to ~/.config/opencode/opencode.jsonc or agents? Paste snippets.
      render: json
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / error messages
      description: Paste relevant logs. Sensitive data (API keys, IPs) get redacted - please don't share secrets.
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else worth knowing?
    validations:
      required: false
